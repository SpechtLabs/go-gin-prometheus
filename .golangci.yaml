# golangci-lint configuration for go-gin-prometheus.
#
# golint-sl runs as a module plugin baked into ./custom-gcl (see .custom-gcl.yml).
# The prebuilt golangci-lint cannot load the plugin, so run it with
# `mise run lint`, which builds custom-gcl and runs it.
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    # Default linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional recommended linters
    - dogsled
    - copyloopvar
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - modernize
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - whitespace
    - unconvert
    - unparam

    # golint-sl: production-ready Go patterns (error handling, observability, safety)
    # https://golint.specht-labs.de/
    - golint-sl

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      # fieldalignment stays on: the middleware runs on every request of the
      # service that uses it. Test tables are excluded below.
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    custom:
      golint-sl:
        type: module
        description: SpechtLabs Go linter collection for production-ready code
        original-url: github.com/spechtlabs/golint-sl

  exclusions:
    generated: lax
    rules:
      # Hold test files to a lighter bar than production code.
      - linters:
          - gosec
          - goconst
          - golint-sl
        path: _test\.go

      - linters:
          - govet
        text: "^fieldalignment:"
        path: _test\.go

      # The package name is the upstream's, and prometheus is singular; the
      # check takes its final s for a plural. GinPrometheusMiddleware and
      # GinPrometheusOpt stutter, and the With... options return
      # GinPrometheusOpt rather than a type named Option, but they are the
      # published API that consumers call; renaming them would break every
      # one of them.
      - linters:
          - golint-sl
        text: "^(pkgnaming|optionspattern):"
        path: ^(middleware|options|exporter)\.go$

      # The middleware times each request with the wall clock, and the push
      # gateway loop ticks on it. Neither has a request to take a trace ID
      # from: the errors they log come from the background goroutines that
      # serve the metrics endpoint and push to the gateway.
      - linters:
          - golint-sl
        text: "^(clockinterface|wideevents):"
        path: ^(middleware|exporter)\.go$

    paths:
      - third_party$
      - builtin$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
